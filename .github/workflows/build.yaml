name: ci
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  test:
    name: test
    env:
      CARGO: cargo
      # When CARGO is set to CROSS, this is set to `--target matrix.target`.
      TARGET_FLAGS: ""
      # When CARGO is set to CROSS, TARGET_DIR includes matrix.target.
      TARGET_DIR: ./target
      # Emit backtraces on panics.
      RUST_BACKTRACE: 1
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build:
          # We test ironhide on a pinned version of Rust, along with the moving
          # targets of 'stable' and 'beta' for good measure.
          # We release off our pinned version, so we test all of those as well
          - pinned
          - pinned-musl
          - pinned-32
          - pinned-arm
          - pinned-arm64
          - msrv
          - stable
          - beta
          - nightly
          - macos-intel
          - macos-arm64
          - win-msvc
          - win-gnu
        include:
          # Only the targets whose linker the runner doesn't already have need cross.
          - build: pinned
            os: ubuntu-24.04
          - build: pinned-musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            cross: true
          - build: pinned-32
            os: ubuntu-24.04
            target: i686-unknown-linux-gnu
            cross: true
          - build: pinned-arm
            os: ubuntu-24.04
            target: arm-unknown-linux-gnueabihf
            cross: true
          - build: pinned-arm64
            os: ubuntu-24.04-arm
          # Keeps rust-version in Cargo.toml honest.
          - build: msrv
            os: ubuntu-24.04
            rust: 1.88.0
          - build: stable
            os: ubuntu-24.04
            rust: stable
          - build: beta
            os: ubuntu-24.04
            rust: beta
          - build: nightly
            os: ubuntu-24.04
            rust: nightly
          - build: macos-intel
            os: macos-15-intel
            target: x86_64-apple-darwin
          - build: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - build: win-msvc
            os: windows-2022
          - build: win-gnu
            os: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: IronCoreLabs/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}

      # if we're on windows building with gnu we need to do something special
      - name: Install win-gnu toolchain
        if: matrix.build == 'win-gnu'
        shell: bash
        run: |
          rustup override set $(cat ./rust-toolchain.toml | grep channel | sed 's/channel = "//' | sed 's/"//')-x86_64-gnu

      # The cache key covers the installed toolchains, so install them first. rust-cache keys
      # on the job id and not the matrix, so `key` keeps the legs sharing a runner and
      # toolchain from evicting each other's target dir.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.build }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Use Cross
        if: matrix.cross
        shell: bash
        run: echo "CARGO=cross" >> $GITHUB_ENV

      - name: Set target flags
        if: matrix.target != ''
        shell: bash
        run: |
          echo "TARGET_FLAGS=--target ${{ matrix.target }}" >> $GITHUB_ENV
          echo "TARGET_DIR=./target/${{ matrix.target }}" >> $GITHUB_ENV

      - name: Show command used for Cargo
        run: |
          echo "cargo command is: ${{ env.CARGO }}"
          echo "target flag is: ${{ env.TARGET_FLAGS }}"

      - name: Build ironhide
        run: ${{ env.CARGO }} build --verbose --workspace ${{ env.TARGET_FLAGS }}

      - name: Run tests
        run: ${{ env.CARGO }} test --verbose --workspace ${{ env.TARGET_FLAGS }}

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: IronCoreLabs/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: IronCoreLabs/rust-toolchain@v1
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: IronCoreLabs/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --workspace
